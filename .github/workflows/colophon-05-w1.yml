name: Colophon 0.5 W1 conformance and verification

on:
  push:
    branches:
      - feat/colophon-05-w1-speaks-for
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colophon-05-w1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Validate formatting of new Rust code
        run: |
          rustfmt --edition 2021 --check crates/colophon-core/src/legacy_draft1/mod.rs crates/colophon-core/src/legacy_draft1/terms.rs crates/colophon-core/src/legacy_draft1/speaks.rs crates/colophon-core/tests/legacy_draft1_conformance.rs
      - name: Replay committed synthetic vectors and check deterministic regeneration
        run: cargo test -p colophon-core --test legacy_draft1_conformance
      - name: Colophon 0.5 candidate engine (v05) and conformance runner
        run: cargo test -p colophon-core --test v05_engine --test v05_candidate -- --nocapture
      - name: Full native workspace suite
        run: cargo test --workspace
      - name: Build wasm target of consuming crate
        run: cargo check -p colophon-wasm --target wasm32-unknown-unknown
