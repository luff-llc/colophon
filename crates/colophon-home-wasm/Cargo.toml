[package]
name = "colophon-home-wasm"
description = "The home's decisions (Colophon 0.5 §13-§14) as a plain C-ABI WebAssembly module for the relay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
colophon-core = { path = "../colophon-core", version = "=0.5.0" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

[dev-dependencies]
p256.workspace = true
sha2.workspace = true
# The core's Swift test fixture (v05_swift_support), for the succession journey: both are
# workspace dependencies of colophon-core already (allowlist in docs/architecture.md).
aes-gcm.workspace = true
hkdf.workspace = true

[lints]
workspace = true
